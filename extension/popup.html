<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #f59e0b;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 14px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #0f172a;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
    }
    .btn:active {
      transform: translateY(0);
    }
    .info {
      margin-top: 14px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
      border-top: 1px solid #1e293b;
      padding-top: 10px;
    }
    kbd {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 1px 4px;
      color: #cbd5e1;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">⚡</span>
    <span class="title">LearnGo Sync</span>
  </div>

  <div class="status-badge" id="status-badge">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Checking server...</span>
  </div>

  <button class="btn" id="sync-btn">
    <span>⚡ Sync This Lesson</span>
  </button>

  <div class="info">
    <div>Shortcut: <kbd>Alt</kbd> + <kbd>S</kbd> on Boot.dev</div>
    <div style="margin-top: 4px;">Writes <code>main.go</code> & <code>main_test.go</code> to LearnGo and automatically runs tests!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
